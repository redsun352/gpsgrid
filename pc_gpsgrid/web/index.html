<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS Grid PC</title><style>body{font-family:Arial;margin:0;background:#101418;color:#eee}header{padding:14px 20px;background:#182028}main{display:flex;gap:16px;padding:16px}.map{position:relative;flex:1;height:650px;background:#e8edf2;border-radius:10px;overflow:hidden}.panel{width:310px;background:#182028;padding:16px;border-radius:10px}.pt{position:absolute;width:12px;height:12px;background:#d22;border-radius:50%;transform:translate(-50%,-50%)}svg{width:100%;height:100%}button,input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border-radius:6px;border:0}button{cursor:pointer;font-weight:bold}.muted{color:#aaa}.gridline{stroke:#333;stroke-width:1}</style></head><body><header><b>GPS Grid PC</b> <span id="status" class="muted">Bağlantı bekleniyor</span></header><main><div class="map"><svg id="svg"></svg></div><aside class="panel"><h3>Saha</h3><div id="info">Nokta: 0</div><label>Grid aralığı (m)</label><input id="spacing" type="number" value="1" min="0.1" step="0.1"><label>Grid açısı (°)</label><input id="angle" type="number" value="0" step="1"><button onclick="generateGrid()">GENERATE GRID</button><button onclick="closePoly()">POLYGON KAPAT</button><button onclick="resetSurvey()">YENİ SAHA</button><h3>Noktalar</h3><div id="points"></div></aside></main><script>let last={points:[],closed:false};const svg=document.getElementById('svg');function project(p,ps){let la=ps.map(x=>x.latitude),lo=ps.map(x=>x.longitude);let minLa=Math.min(...la),maxLa=Math.max(...la),minLo=Math.min(...lo),maxLo=Math.max(...lo);let w=svg.clientWidth,h=svg.clientHeight,pad=50;let sx=(w-2*pad)/Math.max(1e-9,maxLo-minLo),sy=(h-2*pad)/Math.max(1e-9,maxLa-minLa),s=Math.min(sx,sy);return [w/2+(p.longitude-(minLo+maxLo)/2)*s,h/2-(p.latitude-(minLa+maxLa)/2)*s]}function draw(){svg.innerHTML='';let ps=last.points;if(!ps.length)return;let pts=ps.map(p=>project(p,ps));let poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');poly.setAttribute('points',pts.map(p=>p.join(',')).join(' ')+(last.closed?' '+pts[0].join(','):''));poly.setAttribute('fill',last.closed?'rgba(30,120,220,.18)':'none');poly.setAttribute('stroke','#1464d2');poly.setAttribute('stroke-width','4');svg.appendChild(poly);pts.forEach((p,i)=>{let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r','7');c.setAttribute('fill','#d22');svg.appendChild(c)});document.getElementById('info').textContent='Nokta: '+ps.length+(last.closed?' • POLYGON HAZIR':'');document.getElementById('points').innerHTML=ps.map(p=>`P${p.id} — ${Number(p.latitude).toFixed(7)}, ${Number(p.longitude).toFixed(7)} ±${Number(p.accuracy||0).toFixed(1)}m`).join('<br>')}async function poll(){try{let r=await fetch('/api/state');last=await r.json();document.getElementById('status').textContent='PC server bağlı';draw()}catch(e){document.getElementById('status').textContent='Bağlantı hatası'}}async function closePoly(){await fetch('/api/polygon/close',{method:'POST'});poll()}async function resetSurvey(){await fetch('/api/reset',{method:'POST'});poll()}function generateGrid(){if(!last.closed||last.points.length<3)return alert('Önce polygonu kapatın.');alert('Grid üretim motoru bir sonraki aşamada .DAT çıktısına bağlanacak.');}setInterval(poll,1000);poll();</script></body></html>

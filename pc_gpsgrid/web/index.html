<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS Grid PC Control</title>
<style>body{font-family:Arial;margin:0;background:#0e1419;color:#eef2f5}header{padding:14px 20px;background:#18222b;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:1fr 360px;gap:14px;padding:14px}.map{height:calc(100vh - 110px);min-height:600px;background:#e9eef2;border-radius:12px;overflow:hidden}svg{width:100%;height:100%}.panel{background:#18222b;border-radius:12px;padding:14px;overflow:auto;max-height:calc(100vh - 110px)}button,input,select{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;border:0;border-radius:7px}button{cursor:pointer;font-weight:bold}.tabs{display:flex;gap:6px}.tabs button{width:auto}.tab{display:none}.tab.active{display:block}.card{background:#11181e;border:1px solid #303c46;border-radius:8px;padding:10px;margin:8px 0}.good{color:#42d77d}.bad{color:#ff8b8b}.muted{color:#9ca8b2}.point{display:flex;justify-content:space-between;gap:8px}.small{font-size:12px}.danger{background:#6d2020;color:white}.grid{color:#222}.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat div{background:#11181e;padding:8px;border-radius:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}</style></head>
<body><header><b>GPS Grid PC Control</b><span id="status" class="muted">Bağlantı bekleniyor</span></header><main><div class="map"><svg id="svg"></svg></div><aside class="panel"><div class="tabs"><button onclick="tab('field')">SAHA</button><button onclick="tab('devices')">CİHAZLAR</button><button onclick="tab('grid')">GRID</button><button onclick="tab('data')">VERİ</button></div>
<section id="field" class="tab active"><h3>Saha</h3><div class="stat"><div>Nokta<br><b id="count">0</b></div><div>Alan<br><b id="area">0 m²</b></div><div>Çevre<br><b id="perimeter">0 m</b></div><div>Polygon<br><b id="closed">AÇIK</b></div></div><div class="actions"><button onclick="closePoly()">POLYGON KAPAT</button><button onclick="openPoly()">DÜZENLE</button></div><button class="danger" onclick="resetSurvey()">YENİ SAHA</button><h3>Noktalar</h3><div id="points"></div></section>
<section id="devices" class="tab"><h3>Bağlı Cihazlar</h3><div id="clients" class="muted">Cihaz bekleniyor...</div></section>
<section id="grid" class="tab"><h3>Grid / Tarama</h3><label>Grid aralığı (m)</label><input id="spacing" type="number" value="1" min="0.1" step="0.1"><label>Grid açısı (°)</label><input id="angle" type="number" value="0" step="1"><button onclick="generateGrid()">GRID OLUŞTUR</button><div id="gridInfo" class="card">Grid yok</div><p class="small muted">Kapalı polygonun içinde seçilen aralıkla tarama noktaları oluşturulur.</p></section>
<section id="data" class="tab"><h3>Veri / Çıktı</h3><button onclick="download('/api/export/csv')">CSV NOKTALARI</button><button onclick="download('/api/export/xyz')">XYZ NOKTALARI</button><button onclick="download('/api/export/dat')">DAT GRID</button><div class="card"><b>Sunucu</b><br>0.0.0.0:8765<br>Tailscale ile erişilebilir</div></section>
</aside></main>
<script>let last={points:[],closed:false,grid:[]};const svg=document.getElementById('svg');function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function project(p,ps){let la=ps.map(x=>x.latitude),lo=ps.map(x=>x.longitude),minLa=Math.min(...la),maxLa=Math.max(...la),minLo=Math.min(...lo),maxLo=Math.max(...lo),w=svg.clientWidth,h=svg.clientHeight,pad=60,s=Math.min((w-2*pad)/Math.max(1e-9,maxLo-minLo),(h-2*pad)/Math.max(1e-9,maxLa-minLa));return[w/2+(p.longitude-(minLo+maxLo)/2)*s,h/2-(p.latitude-(minLa+maxLa)/2)*s]}function draw(){svg.innerHTML='';let ps=last.points;if(!ps.length)return;let pts=ps.map(p=>project(p,ps));let poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');poly.setAttribute('points',pts.map(p=>p.join(',')).join(' '));poly.setAttribute('fill',last.closed?'rgba(30,120,220,.18)':'none');poly.setAttribute('stroke','#1769d2');poly.setAttribute('stroke-width','4');svg.appendChild(poly);if(last.grid?.length){last.grid.forEach(p=>{let q=project(p,ps),c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1]);c.setAttribute('r','2');c.setAttribute('fill','#333');svg.appendChild(c)})}pts.forEach((q,i)=>{let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1]);c.setAttribute('r','8');c.setAttribute('fill','#d22');svg.appendChild(c);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',q[0]+10);t.setAttribute('y',q[1]-10);t.textContent='P'+ps[i].id;t.setAttribute('fill','#111');t.setAttribute('font-weight','bold');svg.appendChild(t)})}function render(){document.getElementById('count').textContent=last.points.length;document.getElementById('closed').textContent=last.closed?'KAPALI':'AÇIK';let a=last.area_m2||0;document.getElementById('area').textContent=a.toFixed(1)+' m²';document.getElementById('perimeter').textContent=(last.perimeter_m||0).toFixed(1)+' m';document.getElementById('points').innerHTML=last.points.map(p=>`<div class="card point"><span><b>P${p.id}</b><br><span class="small">${Number(p.latitude).toFixed(7)}, ${Number(p.longitude).toFixed(7)}<br>±${Number(p.accuracy||0).toFixed(1)} m · ${Number(p.altitude||0).toFixed(1)} m</span></span><button style="width:auto" onclick="delPoint(${p.id})">SİL</button></div>`).join('');document.getElementById('gridInfo').textContent=last.grid?.length?`Grid: ${last.grid.length} nokta · ${last.grid_spacing_m} m · açı ${last.grid_angle_deg}°`:'Grid yok';draw()}async function poll(){try{let r=await fetch('/api/state');last=await r.json();document.getElementById('status').textContent='🟢 PC server aktif';render();let cr=await fetch('/api/clients');let d=await cr.json();document.getElementById('clients').innerHTML=d.clients?.length?d.clients.map(c=>`<div class="card"><b class="good">● ONLINE</b> ${esc(c.device_name||c.id)}<br><span class="small">${esc(c.ip)}<br>${esc(c.user_agent)}<br>Son bağlantı: ${c.last_seen_seconds}s</span></div>`).join(''):'<span class="muted">Bağlı cihaz yok</span>'}catch(e){document.getElementById('status').textContent='🔴 Sunucu bağlantısı yok'}setTimeout(poll,1000)}async function closePoly(){let r=await fetch('/api/polygon/close',{method:'POST'});if(!r.ok)alert(await r.text());poll()}async function openPoly(){await fetch('/api/polygon/open',{method:'POST'});poll()}async function delPoint(id){if(!confirm('P'+id+' silinsin mi?'))return;await fetch('/api/point/'+id,{method:'DELETE'});poll()}async function resetSurvey(){if(!confirm('Mevcut saha silinsin mi?'))return;await fetch('/api/reset',{method:'POST'});poll()}async function generateGrid(){let spacing=Number(document.getElementById('spacing').value),angle=Number(document.getElementById('angle').value);let r=await fetch('/api/grid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spacing,angle})});let d=await r.json();if(!r.ok)return alert(d.error||'Grid oluşturulamadı');last.grid=d.grid;last.grid_spacing_m=spacing;last.grid_angle_deg=angle;render()}function download(u){location.href=u}setInterval(()=>{},10000);poll();</script></body></html>

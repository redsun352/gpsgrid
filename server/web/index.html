<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS Grid PC</title><style>body{font-family:Arial;margin:20px;background:#111;color:#eee}canvas{width:100%;height:65vh;background:#20252b;border-radius:12px}button{padding:10px 16px;margin:5px;border:0;border-radius:8px}#info{margin:10px 0}</style></head><body><h1>GPS Grid — PC</h1><div id="info">Bağlantı bekleniyor…</div><canvas id="map"></canvas><script>const c=document.getElementById('map'),x=c.getContext('2d');function draw(s){const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;x.clearRect(0,0,w,h);const p=s.points||[];document.getElementById('info').textContent=`Nokta: ${p.length} | Polygon: ${s.closed?'KAPALI':'AÇIK'} | Alan: ${(s.area_m2||0).toFixed(1)} m²`;if(!p.length)return;const minLa=Math.min(...p.map(a=>a.latitude)),maxLa=Math.max(...p.map(a=>a.latitude)),minLo=Math.min(...p.map(a=>a.longitude)),maxLo=Math.max(...p.map(a=>a.longitude)),sx=w/Math.max(1e-9,maxLo-minLo),sy=h/Math.max(1e-9,maxLa-minLa),sc=Math.min(sx,sy)*.75,cx=w/2,cy=h/2,cl=(minLo+maxLo)/2,ca=(minLa+maxLa)/2;const pos=a=>[cx+(a.longitude-cl)*sc,cy-(a.latitude-ca)*sc];x.beginPath();p.forEach((a,i)=>{const[q,r]=pos(a);i?x.lineTo(q,r):x.moveTo(q,r)});if(s.closed)x.closePath();x.strokeStyle='#38bdf8';x.lineWidth=5*devicePixelRatio;x.stroke();p.forEach(a=>{const[q,r]=pos(a);x.beginPath();x.arc(q,r,8*devicePixelRatio,0,Math.PI*2);x.fillStyle='#f43f5e';x.fill()})}async function poll(){try{draw(await(await fetch('/api/state')).json())}catch(e){document.getElementById('info').textContent='Sunucu bağlantısı yok'}setTimeout(poll,1000)}poll();</script></body></html>
